<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開演</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* 「開演」的視覺立場：這不是 SaaS 儀表板，也不是海報藝廊，是一份為今晚做決定
     而編排的當代影劇版。所以——紙色不是冷灰、用線不用卡、用基線不用陰影。
     刻意避開的東西：圓角尺度、卡片浮起、毛玻璃、等寬字型當裝飾、每個資訊都裝進藥丸。 */
  :root {
    --paper: #F3F0E8;      /* 報紙底色，不是冷灰 SaaS 背景 */
    --sheet: #FBFAF6;      /* 內容面，與底色只差一點，層級交給線條 */
    --ink: #191713;
    --ink2: #625E56;       /* 次要文字，仍然讀得清楚，不是淡到看不見 */
    --ink3: #8A857B;
    --line: #D5D0C5;       /* 一般細線 */
    --rule: #292621;       /* 分段粗線，版面的骨架 */
    --red: #B52A1D;        /* 戲院紅，稀缺使用 */
    --red-bg: #F3E2DC;
    --blue: #28627A;       /* 策展・活動場，與紅色分工明確 */
    --blue-bg: #E2EDF0;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #171613;
      --sheet: #201E1A;
      --ink: #EEE9DE;
      --ink2: #A9A297;
      --ink3: #7C7669;
      --line: #403C35;
      --rule: #6A6459;
      --red: #E05B47;
      --red-bg: #3A211C;
      --blue: #6FA8C0;
      --blue-bg: #1B2E36;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171613;
    --sheet: #201E1A;
    --ink: #EEE9DE;
    --ink2: #A9A297;
    --ink3: #7C7669;
    --line: #403C35;
    --rule: #6A6459;
    --red: #E05B47;
    --red-bg: #3A211C;
    --blue: #6FA8C0;
    --blue-bg: #1B2E36;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* 場次表全靠數字垂直對齊來掃讀，所以整站開等寬數字——但不用等寬「字型」，
     那會讓中文也被拉成資料介面的語氣。 */
  body { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px 80px; }

  /* ── 報頭 ────────────────────────────────── */
  header {
    padding: 28px 0 10px;
    border-bottom: 2px solid var(--rule);
    margin-bottom: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 {
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: 32px;
    letter-spacing: .06em;
    margin: 0;
    line-height: 1.15;
  }
  h1 .dot { color: var(--red); }
  .sub { color: var(--ink2); font-size: 13px; }
  /* 涵蓋範圍是可信度，不是儀表板 KPI——濃縮成一行說明文字 */
  .stats { margin-left: auto; color: var(--ink3); font-size: 12px; letter-spacing: .02em; }
  .stat { display: inline; }
  .stat b { font-weight: 700; color: var(--ink2); }
  .stat span { display: none; }

  /* ── 控制列 ───────────────────────────────── */
  .controls {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    margin: 0 -24px;
    padding: 10px 24px 10px;
  }
  .dates { display: flex; gap: 0; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
  /* 日期是一條連續標尺，不是十四顆漂浮按鈕 */
  .day {
    flex: 0 0 auto;
    border: 0;
    border-right: 1px solid var(--line);
    background: transparent;
    color: var(--ink2);
    padding: 3px 12px 4px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    line-height: 1.25;
    min-width: 56px;
  }
  .day:first-child { border-left: 1px solid var(--line); }
  .day b { display: block; font-size: 15px; font-weight: 600; }
  .day span { font-size: 11px; color: var(--ink3); }
  .day[aria-pressed="true"] { background: var(--red); color: #FBFAF6; }
  .day[aria-pressed="true"] b { font-weight: 700; }
  .day[aria-pressed="true"] span { color: #FBFAF6; opacity: .8; }

  .row2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--ink2);
    font-family: inherit;
    font-size: 13px;
    padding: 4px 12px;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); font-weight: 700; }
  select, .search {
    border: 1px solid var(--line);
    background: var(--sheet);
    color: var(--ink);
    border-radius: 3px;
    padding: 4px 8px;
    font-size: 13px;
    font-family: inherit;
  }
  .search { flex: 1 1 160px; min-width: 140px; }
  .search::placeholder { color: var(--ink3); }
  .toggle {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink2);
    border-radius: 3px;
    padding: 4px 10px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .toggle[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); font-weight: 700; }
  .toggle .box { display: none; }
  button:focus-visible, select:focus-visible, .search:focus-visible, a:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 1px;
  }

  .row-extra { margin-top: 6px; padding-top: 6px; border-top: 1px dotted var(--line); }
  #more-filters[aria-expanded="true"] { border-color: var(--ink2); color: var(--ink); }
  .summary { color: var(--ink2); font-size: 13px; margin: 16px 0 4px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .summary b { color: var(--ink); font-weight: 700; }
  .summary .clear { color: var(--red); cursor: pointer; background: none; border: 0; font-family: inherit; font-size: 13px; padding: 0; }

  /* ── 電影段落：連續版面，不是一疊卡片 ───────────── */
  .card {
    background: transparent;
    border: 0;
    border-top: 2px solid var(--rule);
    border-radius: 0;
    padding: 16px 0 0;
    margin: 0 0 28px;
    box-shadow: none;
  }
  .head { display: flex; gap: 16px; align-items: flex-start; }
  .poster {
    flex: 0 0 62px;
    width: 62px;
    height: 93px;
    border-radius: 0;
    background-color: var(--line);
    overflow: hidden;
    position: relative;
  }
  .poster img { position: absolute; max-width: none; }
  .headtext { flex: 1; min-width: 0; }
  h2 {
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 4px;
    text-wrap: balance;
    line-height: 1.3;
  }
  .en { color: var(--ink2); font-size: 12px; margin-bottom: 8px; }
  .meta { color: var(--ink2); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  /* 分級、片長這些只是文字，不需要每個都裝進框裡 */
  .pill { color: var(--ink2); white-space: nowrap; }
  .pill.ev { color: var(--blue); font-weight: 700; }
  .syn {
    color: var(--ink2);
    font-size: 13px;
    margin-top: 8px;
    line-height: 1.7;
    max-width: 64ch;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: pointer;
  }
  .syn.open { -webkit-line-clamp: unset; }

  /* ── 戲院與場次 ───────────────────────────── */
  .venues { margin-top: 16px; border-top: 1px solid var(--rule); }
  .venue {
    display: flex;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    align-items: baseline;
  }
  .vname { flex: 0 0 190px; font-size: 14px; font-weight: 500; line-height: 1.45; }
  /* 地區改成群組標題，不再每家戲院重複掛一次 */
  .vname .area { display: none; }
  .times { display: flex; gap: 0 14px; flex-wrap: wrap; flex: 1; min-width: 0; align-items: baseline; }
  /* 場次時間是文字不是按鈕：二十個框會變成砂礫，純文字才掃得動 */
  .t {
    display: inline-block;
    min-width: 5ch;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
    padding: 2px 0;
  }
  .t:hover { color: var(--red); text-decoration: underline; text-underline-offset: 3px; }
  .t .lab { display: none; }
  .t.ev { color: var(--blue); }
  .t.past { opacity: .35; font-weight: 500; }
  /* 版本提到群組層級：同一版本的場次排一列，標籤只出現一次 */
  .vergroup { display: flex; gap: 12px; align-items: baseline; width: 100%; }
  .verlabel {
    flex: 0 0 auto;
    min-width: 8em;
    font-size: 11px;
    color: var(--ink3);
    letter-spacing: .02em;
    padding-top: 3px;
  }
  .verlabel.ev { color: var(--blue); font-weight: 700; }

  /* 地區群組標題 */
  .areahead {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink2);
    letter-spacing: .08em;
    padding: 14px 0 4px;
    border-bottom: 1px solid var(--line);
  }
  .areahead span { color: var(--ink3); font-weight: 400; letter-spacing: 0; }

  .price, .dist {
    display: inline-block;
    margin-left: 8px;
    font-size: 11px;
    color: var(--ink3);
    text-decoration: none;
    white-space: nowrap;
  }
  a.price:hover { color: var(--red); text-decoration: underline; }
  .dist { color: var(--blue); }
  .dist.rough { opacity: .8; }
  .price.approx::after { content: "＊"; }

  .empty { text-align: center; color: var(--ink2); padding: 60px 16px; }
  .empty b { display: block; font-size: 17px; color: var(--ink); margin-bottom: 6px; font-family: "Noto Serif TC", serif; }
  .more {
    display: block;
    width: 100%;
    margin: 4px 0 28px;
    padding: 10px;
    border: 0;
    border-top: 1px solid var(--line);
    background: transparent;
    color: var(--ink2);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
  }
  .more:hover { color: var(--red); }

  footer { margin-top: 40px; border-top: 2px solid var(--rule); padding-top: 14px; color: var(--ink3); font-size: 12px; line-height: 1.7; }
  footer p { margin: 4px 0; }
  footer a { color: var(--ink2); }
  footer a:hover { color: var(--red); }
  footer b { color: var(--ink2); }

  /* ── 單片模式 ─────────────────────────────── */
  .titlebtn { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  .titlebtn:hover { color: var(--red); }
  .alldays {
    border: 0;
    background: none;
    color: var(--red);
    padding: 0;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .alldays:hover { text-decoration: underline; }
  .back { border: 0; background: none; color: var(--ink2); font-family: inherit; font-size: 13px; padding: 0 0 12px; cursor: pointer; }
  .back:hover { color: var(--red); }
  .poster.big { flex-basis: 88px; width: 88px; height: 132px; }
  .poster.big img { transform: scale(1.42); transform-origin: top left; }
  .hint { color: var(--ink3); font-size: 12px; margin-top: 10px; }
  .daycard { border-top: 1px solid var(--line); padding-top: 12px; margin-bottom: 20px; }
  .dayhead { display: flex; align-items: baseline; gap: 10px; padding-bottom: 4px; }
  .dayhead b { font-size: 16px; font-weight: 700; }
  .dayhead span { color: var(--ink3); font-size: 12px; }

  @media (max-width: 640px) {
    body { font-size: 15px; }
    .wrap { padding: 0 14px 60px; }
    .controls { margin: 0 -14px; padding: 8px 14px; }
    h1 { font-size: 26px; }
    h2 { font-size: 19px; }
    .stats { display: none; }
    .vname { flex-basis: 100%; }
    .verlabel { min-width: 6em; }
    .poster { flex-basis: 52px; width: 52px; height: 78px; }
  }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>開演<span class="dot">.</span></h1>
      <span class="sub">全台電影場次，一頁查完</span>
    </div>
    <div class="stats">全台 <b>__NCINEMA__</b> 家影城・<b>__NMOVIE__</b> 部電影・場次至 <b>__LASTDATE__</b></div>
  </header>

  <div class="controls">
    <div class="dates" id="dates" role="group" aria-label="日期"></div>
    <!-- 控制項分兩層：常用的永遠可見，低頻條件收進「更多篩選」。
         十個同權重的控制項擠在一起時，手機上會佔掉半個畫面，而且每項看起來一樣重要。 -->
    <div class="row2">
      <div class="seg" role="group" aria-label="檢視方式">
        <button id="vMovie" aria-pressed="true">按電影</button>
        <button id="vCinema" aria-pressed="false">按戲院</button>
      </div>
      <select id="area" aria-label="地區"></select>
      <select id="sort" aria-label="戲院排序">
        <option value="area">依地區</option>
        <option value="next">最快開演</option>
        <option value="dist">距離最近</option>
        <option value="price">票價最低</option>
      </select>
      <input class="search" id="q" type="search" placeholder="搜尋片名或戲院…">
      <button class="toggle" id="more-filters" aria-expanded="false">更多篩選</button>
    </div>
    <div class="row2 row-extra" id="extra" hidden>
      <select id="lang" aria-label="配音語言"></select>
      <select id="slot" aria-label="時段">
        <option value="all">全時段</option>
        <option value="morning">早場 ‹12:00</option>
        <option value="afternoon">下午 12–17</option>
        <option value="evening">晚場 17–22</option>
        <option value="late">午夜 22:00›</option>
      </select>
      <button class="toggle" id="tEvent" aria-pressed="false">只看策展・活動場</button>
      <button class="toggle" id="tSoon" aria-pressed="false">顯示已開演場次</button>
      <button class="toggle" id="tEnd" aria-pressed="false">顯示散場時間</button>
      <button class="toggle" id="near" title="用瀏覽器定位，依距離排序戲院">離我最近</button>
      <button class="toggle" id="share" title="複製目前查詢的連結">分享這個查詢</button>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div id="list"></div>

  <footer>
    <p>資料來源：<b>__SOURCES__</b> 各家官方公開場次頁／API。本站只顯示場次時刻，
      <b>不提供訂票也不處理付款</b>；點場次會跳轉至該影城自己的訂票頁完成購票。</p>
    <p>若您是影城業者，希望調整或移除本站呈現的貴公司場次資料，請至
      <a href="https://github.com/YHHuan/kaiyan-showtimes/issues" target="_blank" rel="noopener">GitHub Issues</a>
      告知，我們會儘速配合處理。</p>
    <p>場次更新於 <b>__GENERATED__</b>，每日自動重抓。<span id="notice"></span>
      實際場次與票種以各影城官方公告為準；威秀影城因全站機器人防護尚未納入。</p>
    <p>散場時間為估算（片長＋約 12 分鐘廣告），僅供參考。</p>
  </footer>
</div>

<script>
var DATA = __DATA__;
(function () {
  "use strict";

  var DOW = ["日", "一", "二", "三", "四", "五", "六"];
  // 哪些標籤算「策展・活動場」。實際標籤只有九十幾種，逐一掃過歸納出來的；
  // 語言與影廳規格（數位 英語 / ATMOS / B.O.X.）刻意不列入，那是一般場次。
  var EVENT_RE = new RegExp([
    "影展", "映畫祭", "座談", "映後", "映前", "導聆", "講座", "QA", "Q&A",
    "特別場", "海報場", "限定", "親子", "嬰兒車", "音樂會", "同樂會", "應援",
    "放映會", "見面會", "影人", "導演", "修復", "特映", "首映", "試映", "包場",
    "情人節", "報名制", "索取制", "免費放映", "聽．視界", "口述影像", "LIVE VIEWING", "LIVE",
    // TFAI 等策展單位的節目單元名稱：這些場次正是這個站最該突顯的東西
    "選映", "PICKS", "TIDF", "週年", "系列", "特別企劃", "單元", "策展", "回顧展"
  ].join("|"), "i");

  // 配音語言。各家寫法差很多：「數位 英語」「ATMOS‧數位‧英文版」「2D/英語」，
  // 開眼甚至只寫一個「英」字。語言關係到會不會買錯票（國語配音 vs 原音），所以要能篩。
  var LANG_RULES = [
    ["國語", /國語|中文版|國配|^國$|[‧・\/ ]國$/],
    ["日語", /日語|日文版|^日$|[‧・\/ ]日$/],
    ["英語", /英語|英文版|^英$|[‧・\/ ]英$/],
    ["韓語", /韓語|韓文版|^韓$|[‧・\/ ]韓$/],
    ["粵語", /粵語|粵文版|^粵$|[‧・\/ ]粵$/],
    ["法語", /法語|法文版|^法$|[‧・\/ ]法$/],
    ["義大利語", /義大利語|義語|^義$|[‧・\/ ]義$/],
    ["挪威語", /挪威語|^挪$|[‧・\/ ]挪$/],
    ["越南語", /越南語/],
    ["印地語", /印地語|印度語/],
    ["泰語", /泰語/],
    ["台語", /台語(?!片)/]
  ];

  function langOf(tag) {
    if (!tag) return null;
    for (var i = 0; i < LANG_RULES.length; i++) if (LANG_RULES[i][1].test(tag)) return LANG_RULES[i][0];
    return null;
  }

  var C = DATA.cinemas, M = DATA.movies, H = DATA.halls, T = DATA.tags, U = DATA.urls, D = DATA.dates;
  var META = DATA.meta, SPRITE = DATA.sprite, PRICE = DATA.prices || [], GEO = DATA.geo || [];

  // 來源狀態：某家本輪沒抓到時，明講是沿用舊資料，不要讓使用者以為是即時的
  var NOTICE = "__NOTICE__";
  if (NOTICE) {
    var nEl = document.getElementById("notice");
    if (nEl) { nEl.textContent = NOTICE + " "; nEl.style.color = "var(--accent)"; }
  }

  var CELL_W = 62, CELL_H = 93;
  // 正片前的廣告與預告，各家約 10-15 分鐘；散場時間是估算，不是官方數字
  var ADS = 12;

  // 解開 build 端壓好的場次字串：組間 ';'、欄位 ','、同組多個時間 '.'，數字都是 36 進位。
  // 展開成一維陣列 [戲院, 電影, 日期, 連結, 廳, 標籤, 分鐘數]，後面所有篩選都吃這個。
  var ROWS = (function () {
    var out = [];
    var packed = DATA.packed;
    if (!packed) return out;
    var groups = packed.split(";");
    for (var i = 0; i < groups.length; i++) {
      var f = groups[i].split(",");
      var ci = parseInt(f[0], 36), mi = parseInt(f[1], 36), di = parseInt(f[2], 36);
      var hi = parseInt(f[3], 36), ti = parseInt(f[4], 36);
      var times = f[5].split(".");
      for (var j = 0; j < times.length; j++) {
        out.push([ci, mi, di, hi, ti, parseInt(times[j], 36)]);
      }
    }
    return out;
  })();

  var TAG_LANG = T.map(langOf); // 標籤索引 → 語言，先算好避免每次篩選重跑正規表達式

  // 索引：0=戲院 1=電影 2=日期 3=廳 4=標籤 5=分鐘數
  function isEvent(r) { var t = T[r[4]]; return !!t && EVENT_RE.test(t); }
  function hhmm(m) { return p2(Math.floor(m / 60)) + ":" + p2(m % 60); }
  // 訂票連結是每家戲院一個樣板；{d}=2026-08-21、{s}=2026%2F08%2F21（國賓那種帶查詢日期的）
  function bookUrl(r) {
    var d = D[r[2]]; // 用這一筆場次自己的日期，不能用 state.date——單片模式下每筆日期都不同
    return (U[r[0]] || "")
      .replace("{d}", d)
      .replace("{s}", encodeURIComponent(d.replace(/-/g, "/")));
  }

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem("kaiyan." + k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem("kaiyan." + k, v); } catch (e) {} }
  };

  var state = {
    date: D[0],
    view: store.get("view", "movie"),
    area: store.get("area", "全部"),
    slot: "all",
    lang: "all",
    sort: "area",
    expanded: {},   // 哪幾部片的戲院清單已展開
    onlyEvent: false,
    showPast: false,   // 預設隱藏今天已開演的場次——全部列出再變灰對決策沒幫助
    showEnd: store.get("showEnd", "0") === "1",
    movie: null,      // 單片模式：鎖定某部電影，跨日期看全部場次
    dates: [],        // 單片模式下的多選日期，空陣列＝全部日期
    q: "",
    limit: 40
  };

  var areas = Object.keys(C.reduce(function (a, c) { if (c[1]) a[c[1]] = 1; return a; }, {})).sort();
  if (areas.indexOf(state.area) < 0) state.area = "全部";

  // 台北時間的「現在」，用來判斷場次是否已開演
  function taipeiNow() {
    var s = new Date().toLocaleString("en-US", { timeZone: "Asia/Taipei", hour12: false });
    var d = new Date(s);
    return { date: d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()), mins: d.getHours() * 60 + d.getMinutes() };
  }
  function p2(n) { return n < 10 ? "0" + n : "" + n; }
  function toMins(t) { return (+t.slice(0, 2)) * 60 + (+t.slice(3, 5)); }
  var NOW = taipeiNow();

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;

  }

  function renderDates() {
    var box = document.getElementById("dates");
    box.textContent = "";
    var single = state.movie != null;
    // 單片模式下這排變成可複選的篩選器（都不選＝全部日期）；平常則是單選某一天
    var showDates = single ? datesWithMovie(state.movie) : D;
    showDates.forEach(function (d) {
      var b = el("button", "day");
      var dt = new Date(d + "T00:00:00");
      b.appendChild(el("b", null, d.slice(5).replace("-", "/")));
      b.appendChild(el("span", null, d === NOW.date ? "今天" : DOW[dt.getDay()]));
      var on = single ? state.dates.indexOf(d) >= 0 : d === state.date;
      b.setAttribute("aria-pressed", String(on));
      b.onclick = function () {

          var i = state.dates.indexOf(d);

        } else {
          state.date = d;
        }
        state.limit = 40;
        render();
      };
      box.appendChild(b);
    });
  }

  // 這部片有場次的日期（不受地區/時段等篩選影響，才不會讓日期列忽隱忽現）
  function datesWithMovie(mi) {
    var seen = {};
    for (var i = 0; i < ROWS.length; i++) if (ROWS[i][1] === mi) seen[D[ROWS[i][2]]] = 1;
    return D.filter(function (d) { return seen[d]; });

  function renderLangOptions() {

  function renderAreaOptions() {

  function slotOk(m) {
    switch (state.slot) {
      case "morning": return m < 720;
      case "afternoon": return m >= 720 && m < 1020;
      case "evening": return m >= 1020 && m < 1320;
      case "late": return m >= 1320;
      default: return true;
    }
  }

  function filtered() {
    var di = D.indexOf(state.date);
    var q = state.q;
    var out = [];
    for (var i = 0; i < ROWS.length; i++) {
      var r = ROWS[i];
      if (state.movie != null) {
        if (r[1] !== state.movie) continue;
        if (state.dates.length && state.dates.indexOf(D[r[2]]) < 0) continue;
      } else if (r[2] !== di) continue;
      if (state.area !== "全部" && C[r[0]][1] !== state.area) continue;
      if (!slotOk(r[5])) continue;
      if (state.lang !== "all" && TAG_LANG[r[4]] !== state.lang) continue;
      if (state.onlyEvent && !isEvent(r)) continue;
      if (!state.showPast && D[r[2]] === NOW.date && r[5] < NOW.mins) continue;
      if (q && M[r[1]][0].toLowerCase().indexOf(q) < 0 && C[r[0]][0].toLowerCase().indexOf(q) < 0) continue;
      out.push(r);

  function group(rows, keyIdx) {
    var m = new Map();
    for (var i = 0; i < rows.length; i++) {

    return m;
  }

  // 各家票價按影廳規格分級，我們只拿得準「全票最低價」，所以一律標「起」。
  // 有些影城的票價表是圖片、數字靠人工轉譯且不會自動更新，這種標成「參考」。
  function priceTag(pr) {
    var a = pr[1] ? document.createElement("a") : el("span");
    a.className = "price" + (pr[2] ? " approx" : "");
    if (pr[1]) { a.href = pr[1]; a.target = "_blank"; a.rel = "noopener"; }
    a.textContent = "全票 $" + pr[0] + " 起";
    a.title = pr[2]
      ? "官方票價表為圖片，數字為人工轉譯、可能未及更新；點擊查看官方票價頁"
      : "各影廳規格價格不同，此為全票最低價；點擊查看官方票價頁";
    return a;
  }

  // 定位只存在這個瀏覽器分頁裡，不會送到任何地方——距離全部在前端算。
  var myPos = null;

  function distKm(ci) {
    var g = GEO[ci];
    if (!g || !myPos) return null;
    var R = 6371, toRad = Math.PI / 180;
    var dLat = (g[0] - myPos.lat) * toRad, dLng = (g[1] - myPos.lng) * toRad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(myPos.lat * toRad) * Math.cos(g[0] * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function distTag(ci) {
    var km = distKm(ci);
    if (km == null) return null;
    var g = GEO[ci];
    var rough = g && g[3];
    // 只查到路名的座標別報到百公尺，那是假的精確度
    var text = rough
      ? "約 " + (km < 1 ? "1" : km.toFixed(0)) + " 公里"
      : (km < 1 ? Math.round(km * 1000) + " 公尺" : km.toFixed(1) + " 公里");
    var t = el("span", "dist" + (rough ? " rough" : ""), text);
    t.title = (rough ? "此影城座標只定位到路名，距離為概估。" : "") +
      "直線距離，非實際路程" + (g && g[2] ? "　" + g[2] : "");
    return t;
  }

  function timeChip(r) {
    var a = el("a", "t");
    a.href = bookUrl(r);
    a.target = "_blank";
    a.rel = "noopener";
    var md = META[r[1]];
    var endM = md && md.d ? (r[5] + md.d + ADS) % 1440 : null;
    a.appendChild(document.createTextNode(
      state.showEnd && endM != null ? hhmm(r[5]) + "–" + hhmm(endM) : hhmm(r[5])
    ));
    var lab = T[r[4]] || H[r[3]];
    if (lab) a.appendChild(el("span", "lab", lab));
    if (isEvent(r)) a.className = "t ev";
    if (D[r[2]] === NOW.date && r[5] < NOW.mins) a.className += " past";
    var hall = H[r[3]];
    a.title = C[r[0]][0] + "　" + M[r[1]][0] + "　" + D[r[2]] + " " + hhmm(r[5]) +
      (endM != null ? "　散場約 " + hhmm(endM) : "") +
      (hall ? "　" + hall : "") + (T[r[4]] ? "　" + T[r[4]] : "");

  }

  // 排序直接改變比較邏輯，所以做成明示的選項而不是藏在篩選器裡。
  // 沒有該欄位資料的（查不到座標、查不到票價）一律排在最後，不要假裝它很遠或很貴。
  function sortVenues(a, b) {
    var byName = C[a[0]][0] < C[b[0]][0] ? -1 : 1;
    function nullsLast(va, vb) {
      if (va != null && vb != null && va !== vb) return va - vb;
      if (va != null && vb == null) return -1;
      if (va == null && vb != null) return 1;
      return byName;
    }
    if (state.sort === "dist" || (state.sort === "area" && myPos)) return nullsLast(distKm(a[0]), distKm(b[0]));
    if (state.sort === "next") return nullsLast(a[1][0] && a[1][0][5], b[1][0] && b[1][0][5]);
    if (state.sort === "price") return nullsLast(PRICE[a[0]] && PRICE[a[0]][0], PRICE[b[0]] && PRICE[b[0]][0]);
    // 依地區：同縣市的排在一起，區內照名稱
    var aa = C[a[0]][1] || "", ba = C[b[0]][1] || "";
    if (aa !== ba) return aa < ba ? -1 : 1;
    return byName;
  }

  // 地區是集合標題，不是每家戲院都掛一次的 metadata——同一區重複幾十次是純視覺噪音。
  var VENUE_PREVIEW = 6; // 一部熱門片可能同時在 60 幾家上映，全部平鋪等於沒有排序

  function appendVenues(container, rows, movieIdx) {
    var byCinema = Array.from(group(rows, 0).entries());
    // 「最快開演」需要每家的第一場，先各自排好時間再比
    byCinema.forEach(function (p) { p[1].sort(function (x, y) { return x[5] - y[5]; }); });
    byCinema.sort(sortVenues);

    var expanded = movieIdx == null || state.expanded[movieIdx];
    var shown = expanded ? byCinema : byCinema.slice(0, VENUE_PREVIEW);
    var rest = byCinema.length - shown.length;

    var lastArea = null;
    shown.forEach(function (pair) {
      var area = C[pair[0]][1] || "其他";
      // 有定位時是依距離排序，跨區跳來跳去，這時不下地區標題反而更清楚
      if (!myPos && area !== lastArea) {

        var h = el("div", "areahead", area);

      container.appendChild(venueRow(C[pair[0]][0], null, pair[1]));

    if (rest > 0) {

      var byArea = {};

        var a = C[p[0]][1] || "其他";
        byArea[a] = (byArea[a] || 0) + 1;
      });
      var breakdown = Object.keys(byArea).sort(function (x, y) { return byArea[y] - byArea[x]; })
        .map(function (a) { return a + " " + byArea[a]; }).join("・");
      var more = el("button", "more", "另有 " + rest + " 家戲院　" + breakdown);
      more.onclick = function () { state.expanded[movieIdx] = true; render(); };
      container.appendChild(more);
    }
  }

  function venueRow(label, area, rows) {
    var v = el("div", "venue");
    var n = el("div", "vname");
    if (area) n.appendChild(el("span", "area", area));
    n.appendChild(document.createTextNode(label));
    // 票價：只掛在「按電影」的戲院列上（按戲院檢視時戲院名在卡片標題，價錢放那裡）
    var pr = rows.length ? PRICE[rows[0][0]] : null;
    if (pr) n.appendChild(priceTag(pr));
    if (rows.length) { var dt2 = distTag(rows[0][0]); if (dt2) n.appendChild(dt2); }
    v.appendChild(n);
    var times = el("div", "times");
    rows.sort(function (a, b) { return a[5] - b[5]; });

    // 版本（ATMOS‧數位‧英文版）先前黏在每個場次後面，一家戲院二十場就重複二十次，
    // 文字量比時間本身還多。改成同版本歸一列、標籤只寫一次。
    var byVer = new Map();
    for (var i = 0; i < rows.length; i++) {
      var key = T[rows[i][4]] || H[rows[i][3]] || "";
      if (!byVer.has(key)) byVer.set(key, []);
      byVer.get(key).push(rows[i]);

    if (byVer.size <= 1) {

      Array.from(byVer.entries())
        .sort(function (a, b) { return a[1][0][5] - b[1][0][5]; })
        .forEach(function (pair) {
          var g = el("div", "vergroup");
          var lab = el("div", "verlabel" + (pair[1].some(isEvent) ? " ev" : ""), pair[0] || "一般場");
          g.appendChild(lab);
          var tt = el("div", "times");
          pair[1].forEach(function (r) { tt.appendChild(timeChip(r)); });
          g.appendChild(tt);
          times.appendChild(g);
        });
    }
    v.appendChild(times);
    return v;
  }

  // 單片模式最上面的那張卡：返回、海報、完整簡介、跨日期的統計

  // 把目前的篩選條件寫進網址，讓「這部片的場次」可以直接傳給別人。
  // 只寫非預設值，網址才不會又長又醜。
  function syncUrl() {
    var p = new URLSearchParams();
    if (state.movie != null) {
      p.set("m", M[state.movie][0]);
      if (state.dates.length) p.set("dd", state.dates.join(","));
    } else if (state.date !== D[0]) p.set("d", state.date);
    if (state.view !== "movie") p.set("v", state.view);
    if (state.area !== "全部") p.set("a", state.area);
    if (state.slot !== "all") p.set("s", state.slot);
    if (state.lang !== "all") p.set("g", state.lang);
    if (state.sort !== "area") p.set("o", state.sort);
    if (state.q) p.set("q", state.q);
    if (state.onlyEvent) p.set("e", "1");
    if (state.showPast) p.set("n", "1");
    if (state.showEnd) p.set("t", "1");
    var qs = p.toString();
    try {
      history.replaceState(null, "", qs ? location.pathname + "?" + qs : location.pathname);
    } catch (err) {}
  }

  function readUrl() {
    var p;
    try { p = new URLSearchParams(location.search); } catch (err) { return; }
    var m = p.get("m");
    if (m) {
      // 用片名找回索引；片可能已經下檔，找不到就當一般模式處理
      for (var mi = 0; mi < M.length; mi++) if (M[mi][0] === m) { state.movie = mi; break; }
      var dd = p.get("dd");
      if (state.movie != null && dd) state.dates = dd.split(",").filter(function (x) { return D.indexOf(x) >= 0; });
    }
    var d = p.get("d");
    if (d && D.indexOf(d) >= 0) state.date = d;          // 網址上的日期可能已經過期，過期就忽略
    if (p.get("v") === "cinema") state.view = "cinema";
    var a = p.get("a");
    if (a && (a === "全部" || areas.indexOf(a) >= 0)) state.area = a;
    var s = p.get("s");
    if (s && ["all", "morning", "afternoon", "evening", "late"].indexOf(s) >= 0) state.slot = s;
    if (p.get("g")) state.lang = p.get("g");
    if (["next","dist","price"].indexOf(p.get("o")) >= 0) state.sort = p.get("o");
    if (p.get("q")) state.q = p.get("q").trim().toLowerCase();
    state.onlyEvent = p.get("e") === "1";
    state.showPast = p.get("n") === "1";
    if (p.get("t") === "1") state.showEnd = true;
  }

  function render() {
    syncUrl();
    renderDates();
    renderAreaOptions();
    renderLangOptions();
    document.getElementById("vMovie").setAttribute("aria-pressed", String(state.view === "movie"));
    document.getElementById("vCinema").setAttribute("aria-pressed", String(state.view === "cinema"));
    document.getElementById("tEvent").setAttribute("aria-pressed", String(state.onlyEvent));
    document.getElementById("tSoon").setAttribute("aria-pressed", String(state.showPast));
    document.getElementById("tEnd").setAttribute("aria-pressed", String(state.showEnd));

    var rows = filtered();
    var list = document.getElementById("list");
    list.textContent = "";

    var nMovies = new Set(rows.map(function (r) { return r[1]; })).size;
    var nCinemas = new Set(rows.map(function (r) { return r[0]; })).size;
    var sum = document.getElementById("summary");
    sum.textContent = "";
    var nDates = new Set(rows.map(function (r) { return r[2]; })).size;
    sum.appendChild(el("span", null,
      state.movie != null
        ? (state.dates.length ? state.dates.length + " 個指定日期" : nDates + " 天全部場次")
        : state.date));
    sum.appendChild(el("span", null, "·"));
    var b = el("span", null, "");
    b.appendChild(el("b", null, String(nMovies)));
    b.appendChild(document.createTextNode(" 部電影　"));
    b.appendChild(el("b", null, String(nCinemas)));
    b.appendChild(document.createTextNode(" 家戲院　"));
    b.appendChild(el("b", null, rows.length.toLocaleString("en-US")));
    b.appendChild(document.createTextNode(" 個場次"));
    sum.appendChild(b);
    if (state.area !== "全部" || state.slot !== "all" || state.lang !== "all" || state.onlyEvent || state.showPast || state.q || state.sort !== "area") {
      var clr = el("button", "clear", "清除篩選");
      clr.onclick = function () {
        state.area = "全部"; state.slot = "all"; state.lang = "all"; state.onlyEvent = false; state.showPast = false; state.q = ""; state.sort = "area";
        document.getElementById("area").value = "全部";
        document.getElementById("slot").value = "all";
        document.getElementById("lang").value = "all";
        document.getElementById("sort").value = "area";
        document.getElementById("q").value = "";
        store.set("area", "全部");
        state.limit = 40;
        render();
      };
      sum.appendChild(clr);
    }

    if (!rows.length) {
      var e = el("div", "empty");
      e.appendChild(el("b", null, "這個條件查不到場次"));
      e.appendChild(el("div", null, "換個日期、放寬地區或時段試試。"));
      list.appendChild(e);
      return;
    }

    // 單片模式：一部片、跨日期，改成依「日期」分組，每天底下列各戲院場次
    if (state.movie != null) {
      list.appendChild(movieHeader(state.movie, rows));
      var byDate = Array.from(group(rows, 2).entries()).sort(function (a, b) { return a[0] - b[0]; });
      var frag2 = document.createDocumentFragment();
      byDate.forEach(function (pair) {
        var d = D[pair[0]];
        var dt = new Date(d + "T00:00:00");
        var card = el("div", "card daycard");
        var hd = el("div", "dayhead");
        hd.appendChild(el("b", null, d.slice(5).replace("-", "/") + "（" + DOW[dt.getDay()] + "）" + (d === NOW.date ? " 今天" : "")));
        hd.appendChild(el("span", null, pair[1].length + " 場"));
        card.appendChild(hd);
        var vs2 = el("div", "venues");
        appendVenues(vs2, pair[1]);
        card.appendChild(vs2);
        frag2.appendChild(card);
      });
      list.appendChild(frag2);
      return;
    }

    var groups;
    if (state.view === "movie") {
      groups = Array.from(group(rows, 1).entries()).sort(function (a, b) {
        var ae = a[1].some(isEvent), be = b[1].some(isEvent);
        if (ae !== be && state.onlyEvent) return ae ? -1 : 1;
        return b[1].length - a[1].length;
      });
    } else {
      groups = Array.from(group(rows, 0).entries()).sort(function (a, b) {
        var aa = C[a[0]][1] || "", ba = C[b[0]][1] || "";
        if (aa !== ba) return aa < ba ? -1 : 1;
        return C[a[0]][0] < C[b[0]][0] ? -1 : 1;
      });
    }

    var shown = groups.slice(0, state.limit);
    var frag = document.createDocumentFragment();
    shown.forEach(function (pair) {
      frag.appendChild(state.view === "movie" ? movieCard(pair[0], pair[1]) : cinemaCard(pair[0], pair[1]));
    });
    list.appendChild(frag);

    if (groups.length > shown.length) {
      var more = el("button", "more", "顯示其餘 " + (groups.length - shown.length) + " " + (state.view === "movie" ? "部電影" : "家戲院"));
      more.onclick = function () { state.limit += 60; render(); };
      list.appendChild(more);
    }
  }

  document.getElementById("vMovie").onclick = function () { state.view = "movie"; state.limit = 40; store.set("view", "movie"); render(); };
  document.getElementById("vCinema").onclick = function () { state.view = "cinema"; state.limit = 40; store.set("view", "cinema"); render(); };
  document.getElementById("tEvent").onclick = function () { state.onlyEvent = !state.onlyEvent; state.limit = 40; render(); };
  document.getElementById("tSoon").onclick = function () { state.showPast = !state.showPast; state.limit = 40; render(); };
  document.getElementById("tEnd").onclick = function () { state.showEnd = !state.showEnd; store.set("showEnd", state.showEnd ? "1" : "0"); render(); };
  document.getElementById("near").onclick = function () {
    var btn = this;
    if (myPos) { myPos = null; btn.setAttribute("aria-pressed", "false"); btn.textContent = "離我最近"; render(); return; }
    if (!navigator.geolocation) { btn.textContent = "此瀏覽器不支援定位"; return; }
    btn.textContent = "定位中…";
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        btn.setAttribute("aria-pressed", "true");
        btn.textContent = "離我最近";
        render();
      },
      function (err) {
        // 拒絕授權跟定位失敗要分開講，不然使用者不知道該怎麼辦
        btn.textContent = err.code === 1 ? "已拒絕定位權限" : "定位失敗";
        setTimeout(function () { btn.textContent = "離我最近"; }, 2600);
      },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }
    );
  };

  var extraEl = document.getElementById("extra");
  var moreBtn = document.getElementById("more-filters");
  function setExtra(open) {
    extraEl.hidden = !open;
    moreBtn.setAttribute("aria-expanded", String(open));
  }
  moreBtn.onclick = function () { setExtra(extraEl.hidden); };
  document.getElementById("share").onclick = function () {
    var btn = this;
    var url = location.href;
    var done = function (msg) {
      var old = btn.textContent;
      btn.textContent = msg;
      setTimeout(function () { btn.textContent = old; }, 1600);
    };
    if (navigator.share) {
      navigator.share({ title: "開演 — 電影場次", url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () { done("已複製連結"); }, function () { done("複製失敗"); });
    } else {
      done("請直接複製網址列");
    }
  };
  document.getElementById("area").onchange = function (e) { state.area = e.target.value; store.set("area", state.area); state.limit = 40; render(); };
  document.getElementById("slot").onchange = function (e) { state.slot = e.target.value; state.limit = 40; render(); };
  document.getElementById("lang").onchange = function (e) { state.lang = e.target.value; state.limit = 40; render(); };
  document.getElementById("sort").onchange = function (e) {
    state.sort = e.target.value;
    // 選了依距離卻還沒定位，直接幫他觸發，不要讓他選了卻沒反應
    if (state.sort === "dist" && !myPos) document.getElementById("near").click();
    render();
  };
  document.getElementById("q").addEventListener("input", function (e) {
    state.q = e.target.value.trim().toLowerCase();
    state.limit = 40;
    render();
  });

  readUrl();
  // 從網址進來時若已帶進階條件，把面板展開——否則使用者看不出結果為什麼被篩過
  if (state.lang !== "all" || state.slot !== "all" || state.onlyEvent || state.showPast || state.showEnd) setExtra(true);
  document.getElementById("slot").value = state.slot;
  document.getElementById("lang").value = state.lang;
  document.getElementById("sort").value = state.sort;
  document.getElementById("q").value = state.q;
  render();
})();
</script>
